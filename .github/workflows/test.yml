name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: "0.8.3"
          node-version: "24"
      - run: nub install --frozen-lockfile
      - run: nub exec --node biome check packages/zod/src/v4/core/json-schema-processors.ts packages/zod/src/v4/classic/tests/to-json-schema.test.ts
      - run: nub run build
      - run: nub exec --node vitest run packages/zod/src/v4/classic/tests/to-json-schema.test.ts
      - run: nub run test
